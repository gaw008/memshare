[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memhub"
version = "0.1.0"
description = "One shared Markdown memory for all your AI assistants, over MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.3.0",
  "jieba>=0.42.1",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.1.0",
  "uvicorn>=0.35.0",
  "starlette>=1.8.0",
  "argon2-cffi>=25.1.0",
]

[project.scripts]
memhub = "memhub.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.0.0", "httpx2>=2.13.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.test-tmp"

[tool.hatch.build.targets.wheel]
packages = ["src/memhub"]
